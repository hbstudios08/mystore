<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Live Site</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 2.5rem;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 90%;
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
      font-size: 2rem;
    }

    p {
      line-height: 1.6;
      color: #94a3b8;
    }

    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--accent);
      color: #0f172a;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Hello, World!</h1>
    <p>Your live website is up and running successfully from your GitHub repository.</p>
    <a href="#" class="btn" onclick="alert('Working!')">Click Me</a>
  </div>

</body>
</html>
